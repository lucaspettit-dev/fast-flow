[build-system]
requires = ["setuptools>=61", "cython>=3.0", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-flow"
version = "0.2.0"
description = "Fast 2D incompressible flow solver for rapid design iteration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lucas Pettit" }]
keywords = ["fluid", "simulation", "cfd", "navier-stokes", "incompressible"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/lucaspettit-dev/fast-flow"
Repository = "https://github.com/lucaspettit-dev/fast-flow"

[project.scripts]
fast-flow = "fast_flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
