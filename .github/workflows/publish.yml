name: Publish to PyPI

# To use: create a GitHub Release. First, register the project on PyPI
# (upload once manually or reserve the name), then configure Trusted
# Publishing on PyPI for this repo (PyPI project settings ->
# Publishing -> add GitHub publisher: lucaspettit-dev/fast-flow).

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
